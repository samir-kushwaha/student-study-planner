<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student study planner</title>

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- custom css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="#">Student Study Planner</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#Tasksection">Tasks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#Subjectsection">Subjects</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
<div class="container my-4">
  <div class="row g-4">

    <aside class="col-md-4 col-lg-3" id="subjectSection">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h4>Subjects</h4>
          <form id="subjectForm">
            <div class="input-group mb-3">
              <input type="text" id="subjectInput" class="form-control" placeholder="Add subject" required>
              <button class="btn btn-primary" type="submit">Add</button>
            </div>
          </form>
          <div id="subjectList"></div>
        </div>
      </div>
    </aside>

    <main class="col-md-8 col-lg-9" id="taskSection">

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
      <h4>Add Task</h4>
      <form id="taskForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="taskInput" class="form-label">Task Name</label>
            <input type="text" id="taskInput" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label for="taskSubject" class="form-label">Subject</label>
            <select id="taskSubject" class="form-select" required>
              <option value="">Select subject</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="taskDate" class="form-label">Due Date</label>
            <input type="date" id="taskDate" class="form-control" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Add Task</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">My Tasks</h4>
        <span id="taskCount" class="badge bg-primary">0 Tasks</span>
      </div>
      <div id="taskList"></div>
      <p id="emptyMessage" class="text-muted text-center mt-4">No tasks added yet.</p>
    </div>
  </div>

</main>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
